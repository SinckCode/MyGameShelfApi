name: Build & Deploy (Self-hosted)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/sinckcode/mygameshelfapi

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build
    runs-on: [self-hosted, myGameShelf]   # <- etiqueta de tu runner en Proxmox
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copiar docker-compose al servidor
        run: |
          mkdir -p ~/myGameShelf
          cp docker-compose.yml ~/myGameShelf/docker-compose.yml

      - name: Levantar contenedores
        working-directory: ~/myGameShelf
        run: |
          docker compose -f docker-compose.yml pull
          docker compose -f docker-compose.yml up -d --remove-orphans

      - name: Estado de los servicios
        working-directory: ~/myGameShelf
        run: docker compose -f docker-compose.yml ps
